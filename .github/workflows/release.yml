# Push a tag like v0.2.0 to build a universal Noodle.app, attach Noodle.zip to a GitHub
# Release, and (when the TAP_DEPLOY_KEY secret is set) bump the cask in pcybriwsky/homebrew-tap.
#   TAP_DEPLOY_KEY             private half of an SSH deploy key with write access to homebrew-tap only
#
# With the signing secrets set, the app is signed with your Developer ID, notarized by Apple and
# stapled, so it opens without the "Open Anyway" step. Without them it falls back to ad-hoc signing.
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password you exported it with
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           your App Store Connect issuer ID
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Each secret is only handed to the step that needs it.
      HAS_TAP_KEY: ${{ secrets.TAP_DEPLOY_KEY != '' }}
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - name: Check the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME isn't vX.Y.Z"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [[ -n "$ID" ]] || { echo "DEVELOPER_ID_P12 has no Developer ID Application identity"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build Noodle.app
        run: |
          ARCHS="arm64 x86_64" OUT="$RUNNER_TEMP/out" scripts/build-app.sh
          lipo -info "$RUNNER_TEMP/out/Noodle.app/Contents/MacOS/ClaudePosture"
          codesign -dv "$RUNNER_TEMP/out/Noodle.app" 2>&1 | grep -E "^(Authority|TeamIdentifier|Signature|flags)" || true

      - name: Zip
        working-directory: ${{ runner.temp }}/out
        run: ditto -c -k --sequesterRsrc --keepParent Noodle.app Noodle.zip

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ runner.temp }}/out
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit Noodle.zip "${AUTH[@]}" --wait --timeout 30m --output-format json | tee notary.json
          if [[ "$(jq -r .status notary.json)" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id notary.json)" "${AUTH[@]}" || true
            exit 1
          fi
          # Staple the ticket so it opens offline too, then re-zip the stapled app. Fetching the
          # ticket from Apple sometimes drops the connection, so give it a few tries.
          for i in 1 2 3 4 5; do
            xcrun stapler staple Noodle.app && break
            [[ $i == 5 ]] && exit 1
            echo "Stapling failed, trying again in $((i * 15))s"
            sleep $((i * 15))
          done
          spctl --assess --type execute -vv Noodle.app
          rm Noodle.zip notary.json
          ditto -c -k --sequesterRsrc --keepParent Noodle.app Noodle.zip

      - name: Checksum
        working-directory: ${{ runner.temp }}/out
        run: shasum -a 256 Noodle.zip | tee Noodle.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/out/Noodle.zip" "$RUNNER_TEMP/out/Noodle.zip.sha256" \
            --title "Noodle $VERSION" --generate-notes --verify-tag

      - name: Update Homebrew tap
        if: env.HAS_TAP_KEY == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}   # the meta call below rate-limits shared runner IPs when anonymous
        run: |
          set -o pipefail
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/out/Noodle.zip.sha256")"
          KEY="$RUNNER_TEMP/tap_key"
          (umask 077; printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY")
          trap 'rm -f "$KEY"' EXIT
          # GitHub's SSH host keys, from its API over HTTPS, so the push can't be pointed elsewhere.
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
          [[ -s "$RUNNER_TEMP/known_hosts" ]] || { echo "::error::Couldn't fetch GitHub's SSH host keys"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:pcybriwsky/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            packaging/homebrew/noodle.rb > "$RUNNER_TEMP/tap/Casks/noodle.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/noodle.rb
          git diff --cached --quiet || { git commit -m "noodle $VERSION"; git push; }

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Adds Noodle-Windows.zip and NoodleSetup.exe to the release the macOS job just created. Unsigned for now,
  # so Windows SmartScreen asks once ("More info" > "Run anyway").
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish windows/Noodle -c Release -p:Version=$version -o "$env:RUNNER_TEMP/publish" -nologo
          windows/test/hooks-test.ps1 -Exe "$env:RUNNER_TEMP/publish/Noodle.exe"

      - name: Zip and installer
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/out"; New-Item -ItemType Directory $out | Out-Null
          Compress-Archive "$env:RUNNER_TEMP/publish/*" "$out/Noodle-Windows.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" "/DSource=$env:RUNNER_TEMP\publish" "/O$out" windows/installer/noodle.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem $out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName).Hash.ToLower(), $_.Name } |
            Out-File -Encoding ascii "$out/Noodle-Windows.sha256"

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "$env:RUNNER_TEMP/out"
          gh release upload "$env:GITHUB_REF_NAME" "$out/Noodle-Windows.zip" "$out/NoodleSetup.exe" "$out/Noodle-Windows.sha256" --repo "$env:GITHUB_REPOSITORY" --clobber
